name: Update n8n next version
run-name: Mise à jour n8n (Next) 🚀

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    env:
      GITHUB_SERVER_URL: http://100.96.250.43:3000
      GITEA_SERVER_URL: http://100.96.250.43:3000
      GITEA_API_URL: http://100.96.250.43:3000/api/v1
      GITEA_REPOSITORY: jeremiealcaraz/nix-config
    container:
      image: catthehacker/ubuntu:act-latest
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock

    defaults:
      run:
        shell: bash

    steps:
      - name: Fix DNS resolution (workaround Aardvark-dns bug)
        run: |
          echo "🔧 Fixing DNS: replacing Aardvark-dns with public DNS..."
          echo "nameserver 1.1.1.1" > /etc/resolv.conf
          echo "nameserver 8.8.8.8" >> /etc/resolv.conf
          echo "✅ DNS fixed:"
          cat /etc/resolv.conf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: http://100.96.250.43:3000

      # --- VOS SCRIPTS ORIGINAUX (INCHANGÉS) ---
      
      - name: Get current n8n image
        id: current
        run: |
          set -euo pipefail
          echo "🔍 Reading current n8n image from hosts/whitelily/n8n.nix..."
          CURRENT_IMAGE=$(grep -oP 'image = "docker.io/n8nio/n8n:\K[^"]+' hosts/whitelily/n8n.nix)
          echo "✅ Current image: $CURRENT_IMAGE"
          echo "image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT

          echo "🔍 Extracting digest from current image..."
          if [[ "$CURRENT_IMAGE" == *"@sha256:"* ]]; then
            CURRENT_DIGEST=$(echo "$CURRENT_IMAGE" | grep -oP '@sha256:\K[a-f0-9]+')
            echo "✅ Current digest found: $CURRENT_DIGEST"
          else
            CURRENT_DIGEST="none"
            echo "⚠️  No digest in current image (using tag only)"
          fi
          echo "digest=$CURRENT_DIGEST" >> $GITHUB_OUTPUT

      - name: Debug network (Docker Hub)
        run: |
          set -euo pipefail
          echo "🔍 Checking DNS configuration..."
          echo "📄 /etc/resolv.conf:"
          cat /etc/resolv.conf || true
          echo ""
          echo "🌐 Testing DNS resolution for Docker Hub..."
          getent hosts auth.docker.io || echo "❌ Failed to resolve auth.docker.io"
          getent hosts registry-1.docker.io || echo "❌ Failed to resolve registry-1.docker.io"
          echo ""
          echo "🔌 Testing connectivity with curl..."
          curl -v https://auth.docker.io 2>&1 | head -20 || echo "❌ curl to auth.docker.io failed"

      - name: Get latest n8n:next digest from Docker Hub
        id: latest
        run: |
          set -euo pipefail
          echo "🔑 Requesting Docker Hub authentication token..."
          TOKEN=$(curl -fsS --retry 3 --retry-connrefused --retry-delay 1 \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:n8nio/n8n:pull" \
            | jq -r .token)

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "❌ Token Docker Hub introuvable." >&2
            exit 1
          fi
          echo "✅ Token obtained successfully (length: ${#TOKEN} chars)"

          echo "📡 Fetching latest n8n:next manifest from Docker Hub..."
          RESPONSE=$(curl -fsSI --retry 3 --retry-connrefused --retry-delay 1 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/n8nio/n8n/manifests/next")

          echo "📋 HTTP Response headers:"
          echo "$RESPONSE"
          echo ""

          LATEST_DIGEST=$(echo "$RESPONSE" | grep -i "docker-content-digest:" | cut -d' ' -f2 | tr -d '\r' | cut -d: -f2)

          if [[ -z "$LATEST_DIGEST" ]]; then
            echo "❌ Digest n8n:next introuvable dans les headers." >&2
            exit 1
          fi
          echo "✅ Latest digest: $LATEST_DIGEST"
          echo "digest=$LATEST_DIGEST" >> $GITHUB_OUTPUT

      - name: Extract n8n version from image
        id: version
        run: |
          set -euo pipefail
          FULL_IMAGE="docker.io/n8nio/n8n:next@sha256:${{ steps.latest.outputs.digest }}"
          echo "🐳 Pulling image to extract version: $FULL_IMAGE"
          docker pull --quiet "$FULL_IMAGE" > /dev/null 2>&1 || echo "⚠️  Pull may have failed, continuing anyway..."

          echo "🔍 Inspecting image labels..."
          VERSION=$(docker inspect "$FULL_IMAGE" 2>/dev/null | jq -r '.[0].Config.Labels["org.opencontainers.image.version"] // .[0].Config.Labels["version"] // .[0].Config.Labels["org.label-schema.version"] // empty')

          if [ -z "$VERSION" ]; then
            SHORT_DIGEST=$(echo "${{ steps.latest.outputs.digest }}" | cut -c1-12)
            VERSION="next-${SHORT_DIGEST}"
            echo "⚠️  No version label found, using digest-based version: $VERSION"
          else
            echo "✅ Version extracted from labels: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "🧹 Cleaning up pulled image..."
          docker rmi "$FULL_IMAGE" 2>/dev/null || echo "⚠️  Failed to remove image (not critical)"

      - name: Check if update needed
        id: check
        run: |
          set -euo pipefail
          CURRENT="${{ steps.current.outputs.digest }}"
          LATEST="${{ steps.latest.outputs.digest }}"

          echo "🔍 Comparing digests..."
          echo "   Current: $CURRENT"
          echo "   Latest:  $LATEST"

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "🆕 Update needed! New version available."
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Already up to date. No update needed."
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update n8n.nix with new digest
        if: steps.check.outputs.update_needed == 'true'
        run: |
          set -euo pipefail
          LATEST_DIGEST="${{ steps.latest.outputs.digest }}"

          echo "✏️  Updating hosts/whitelily/n8n.nix with new digest..."
          echo "   New digest: $LATEST_DIGEST"

          sed -i 's|image = "docker.io/n8nio/n8n:.*";.*|image = "docker.io/n8nio/n8n:next@sha256:'"$LATEST_DIGEST"'";  # Tag next pour les dernières betas|' hosts/whitelily/n8n.nix

          echo "✅ File updated. Showing diff:"
          git diff hosts/whitelily/n8n.nix || true

      # --- MODIFICATION POUR GITEA (Remplacement de peter-evans) ---

      - name: Push changes and Create PR (Gitea API)
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.N8N_UPDATE_TOKEN }}
          NEW_BRANCH: update/n8n-next-${{ steps.latest.outputs.digest }}
          TARGET_BRANCH: main # Changez ceci si votre branche par défaut est master
        run: |
          set -euo pipefail
          echo "🔧 Configuration Git..."
          git config --global user.email "bot@votre-gitea.com"
          git config --global user.name "Gitea Update Bot"
          echo "✅ Git configured"

          echo "🌿 Creating new branch: $NEW_BRANCH"
          git checkout -b $NEW_BRANCH

          echo "💾 Committing changes..."
          git commit -am "⬆️ Update n8n to next@sha256:${{ steps.latest.outputs.digest }}"
          echo "✅ Commit created"

          echo "⬆️  Pushing to origin..."
          git push origin $NEW_BRANCH
          echo "✅ Branch pushed successfully"

          echo "📝 Preparing PR body..."
          PR_BODY=$(jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg old_digest "${{ steps.current.outputs.digest }}" \
            --arg new_digest "${{ steps.latest.outputs.digest }}" \
            --arg content "## 🚀 Automated n8n Update
          A new version of \`n8n:next\` has been detected.
          **Version:** \`$version\`

          | Previous Digest | New Digest |
          | --- | --- |
          | \`$old_digest\` | \`$new_digest\` |

          *This PR was automatically created by Gitea Actions.*" \
            '$content')
          echo "✅ PR body prepared"

          echo "🚀 Creating Pull Request via Gitea API..."
          PR_RESPONSE=$(curl -X POST "${GITEA_API_URL}/repos/${GITEA_REPOSITORY}/pulls" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "head": "$NEW_BRANCH",
            "base": "$TARGET_BRANCH",
            "title": "⬆️ Update n8n:next to ${{ steps.version.outputs.version }}",
            "body": $PR_BODY
          }
          EOF
          )

          echo "📋 API Response:"
          echo "$PR_RESPONSE" | jq '.' || echo "$PR_RESPONSE"

          # Extraction de l'URL de la PR créée
          PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url // empty')
          if [ -n "$PR_URL" ]; then
            echo "✅ Pull Request created successfully: $PR_URL"
          else
            echo "⚠️  PR may have been created but URL not found in response"
          fi
