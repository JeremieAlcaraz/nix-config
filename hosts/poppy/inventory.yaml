host: poppy
updated_at: "2026-04-16"
role: "Proxmox Backup Server"
os:
  distro: "Debian GNU/Linux 13 (trixie)"
  kernel: "6.17.2-1-pve"
pbs:
  package_version: "proxmox-backup-server 4.1.6-1"
  runtime_version: "4.1.0"
network:
  tailscale_ip: "100.120.10.61"
  tailscale_dns: "poppy.inanga-sirius.ts.net"
monitoring:
  node_exporter:
    installed: true
    service_name: "prometheus-node-exporter"
    endpoint: "http://127.0.0.1:9100/metrics"
backup:
  datastore:
    name: "capsule"
    path: "/backup-disk"
  sync:
    script: "/root/sync-capsule.sh"
    cron: "0 4 * * *"
    destination: "gdrive_capsule:proxmox"
deployment:
  source_of_truth_host: "marigold"
  source_of_truth_path: "/Users/jeremiealcaraz/c/nix-config/hosts/poppy"
  remote_stage_dir: "/var/lib/poppy-deploy"
  legacy_backup_dir: "/root/.bak"
apps:
  root_path: "/root/apps"
  runtime: "podman/podman-compose"
  notes:
    - "Le chemin /apps n'existe pas sur l'hote au moment de l'audit."
  services:
    memos:
      path: "/root/apps/memos"
      compose_file: "/root/apps/memos/compose.yml"
      env_file: "/root/apps/memos/.env.s3"
      exposed_ports:
        - "5230:5230"
      data_paths:
        - "/root/apps/memos/data"
      backup_paths:
        - "/root/apps/memos/backups"
      backup_scripts:
        - "/root/apps/memos/scripts/backup.sh"
        - "/root/apps/memos/scripts/upload-backups.sh"
      backup_scheduler:
        type: "systemd-timer"
        timer_unit: "memos-backup.timer"
        service_unit: "memos-backup.service"
        schedule: "daily 05:30"
      backup_destination: "gdrive_capsule:memos"
    vikunja:
      path: "/root/apps/vikunja"
      compose_file: "/root/apps/vikunja/compose.yml"
      env_file: "/root/apps/vikunja/.env"
      exposed_ports:
        - "3456:3456"
      data_paths:
        - "/root/apps/vikunja/config"
        - "/root/apps/vikunja/data/files"
      backup_paths:
        - "/root/apps/vikunja/backups"
      backup_scripts:
        - "/root/apps/vikunja/scripts/backup.sh"
        - "/root/apps/vikunja/scripts/upload-backups.sh"
      backup_scheduler:
        type: "systemd-timer"
        timer_unit: "vikunja-backup.timer"
        service_unit: "vikunja-backup.service"
        schedule: "BROKEN (unit not found as of 2026-04-16)"
      backup_destination: "gdrive_capsule:vikunja"
      backup_status: "degraded"
    moodboard:
      path: "/root/apps/moodboard"
      compose_file: "/root/apps/moodboard/compose.yml"
      containerfile: "/root/apps/moodboard/Containerfile"
      env_file: "/root/apps/moodboard/.env.prod"
      exposed_ports:
        - "8080:8080"
      data_paths:
        - "/root/apps/moodboard/assets"
        - "/root/apps/moodboard/.local"
      backup_scripts:
        - "/root/apps/moodboard/scripts/backup-moodboard.sh"
      backup_scheduler:
        type: "systemd-timer"
        timer_unit: "backup-moodboard.timer"
        service_unit: "backup-moodboard.service"
        schedule: "daily 03:00"
      backup_destination: "gdrive_capsule:moodboard"
    twenty:
      path: "/root/apps/twenty"
      compose_file: "/root/apps/twenty/compose.yml"
      env_file: "/root/apps/twenty/.env"
      containers:
        - "twenty-server"
        - "twenty-worker"
        - "twenty-db"
        - "twenty-redis"
      exposed_ports:
        - "3000:3000"
        - "5432:5432"
      data_paths:
        - "/root/apps/twenty/data/volumes/twenty-db-data"
        - "/root/apps/twenty/data/volumes/twenty-server-data"
      storage_backend: "garage-s3"
      storage_bucket: "twenty"
      storage_endpoint: "http://host.containers.internal:3900"
      backup_scripts:
        - "/root/apps/twenty/scripts/backup.sh"
      backup_scheduler:
        type: "systemd-timer"
        timer_unit: "twenty-backup.timer"
        service_unit: "twenty-backup.service"
        schedule: "daily 03:00"
      backup_destination: "gdrive_capsule:twenty"
      notes:
        - "pg_dump via podman exec twenty-db"
        - "S3 sync via rclone garage_backup remote"
        - "Latest dump overwrites dump-twenty.sql.gz on Drive (single file)"
        - "S3 objects synced to twenty/s3-objects/"
restic:
  env_file: "/root/.config/restic/env"
  prune_scheduler:
    timer_unit: "restic-prune.timer"
    service_unit: "restic-prune.service"
    schedule: "daily 03:30"
  repositories:
    - app: "memos"
      repo: "rclone:gdrive_capsule:memos"
      latest_snapshot: "2026-04-16 21:03:01"
      snapshot_id: "44db99c5"
    - app: "vikunja"
      repo: "rclone:gdrive_capsule:vikunja"
      latest_snapshot: "2026-04-16 21:03:50"
      snapshot_id: "ed600a1d"
    - app: "moodboard"
      repo: "rclone:gdrive_capsule:moodboard"
      latest_snapshot: "2026-04-16 21:04:42"
      snapshot_id: "b99588ab"
    - app: "twenty"
      repo: "rclone:gdrive_capsule:twenty"
      latest_snapshot: "2026-04-16 21:02:22"
      snapshot_id: "f588f6f7"
  backup_schedulers:
    - app: "memos"
      timer_unit: "memos-restic-backup.timer"
      schedule: "daily 02:00"
    - app: "vikunja"
      timer_unit: "vikunja-restic-backup.timer"
      schedule: "daily 02:20"
    - app: "moodboard"
      timer_unit: "moodboard-restic-backup.timer"
      schedule: "daily 02:40"
    - app: "twenty"
      timer_unit: "twenty-restic-backup.timer"
      schedule: "daily 01:40"
  notes:
    - "Canonical repositories initialized and seeded on 2026-04-16."
    - "Per-app restic timers deployed and active as of 2026-04-16."

legacy_backup_timers:
  disabled:
    - "memos-backup.timer"
    - "memos-s3-backup.timer"
    - "backup-moodboard.timer"
    - "twenty-backup.timer"
  absent_or_broken:
    - "vikunja-backup.timer"

drive_layout_audit_2026_04_16:
  canonical_goal: "gdrive_capsule:<app> (memos|vikunja|moodboard|twenty), restic-only"
  observed_duplicates:
    - "memos + memos-bak"
    - "vikunja + vikunja-bak"
    - "moodboard + moodboard-bak"
    - "twenty + twenty-bak"

backup_scripts_detected:
  - "/root/sync-capsule.sh"
  - "/root/apps/memos/scripts/backup.sh"
  - "/root/apps/memos/scripts/upload-backups.sh"
  - "/root/apps/memos/scripts/backup-s3.sh"
  - "/root/apps/vikunja/scripts/backup.sh"
  - "/root/apps/vikunja/scripts/upload-backups.sh"
  - "/root/apps/moodboard/scripts/backup-moodboard.sh"
  - "/root/apps/twenty/scripts/backup.sh"
  - "/root/apps/restic/memos-restic-backup.sh"
  - "/root/apps/restic/vikunja-restic-backup.sh"
  - "/root/apps/restic/moodboard-restic-backup.sh"
  - "/root/apps/restic/twenty-restic-backup.sh"
