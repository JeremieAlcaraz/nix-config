# Configuration sops pour learnix
# Documentation: https://github.com/Mic92/sops-nix
#
# Configuration avec CLÉ PARTAGÉE (plus simple pour un homelab)
# La même clé est utilisée pour tous les hosts

# Règles de création pour chaque fichier de secrets
creation_rules:
  # Secrets pour l'hôte mimosa (serveur web)
  - path_regex: secrets/mimosa\.yaml$
    key_groups:
      - age:
          # Clé age partagée (générée sur le Mac, copiée sur les VMs)
          # Localisation : ~/.config/sops/age/key.txt (Mac)
          #                /var/lib/sops-nix/key.txt (VMs)
          - &shared age1nt3ly627s6eqcv97zyw3n489gh7nt2jlrq6mfhucct8wq4lgku6saynhhw

  # Secrets pour l'hôte magnolia (infrastructure Proxmox)
  - path_regex: secrets/magnolia\.yaml$
    key_groups:
      - age:
          # Même clé partagée que mimosa
          - *shared

  # Secrets pour l'hôte whitelily (VM n8n automation)
  - path_regex: secrets/whitelily\.yaml$
    key_groups:
      - age:
          # Même clé partagée
          - *shared

  # Secrets pour l'hôte dandelion (VM gitea)
  - path_regex: secrets/dandelion\.yaml$
    key_groups:
      - age:
          # Même clé partagée
          - *shared

  # Secrets pour l'hôte rhizanthella (VM bknd)
  - path_regex: secrets/rhizanthella\.yaml$
    key_groups:
      - age:
          # Même clé partagée
          - *shared

  # Secrets pour l'hôte myosotis (VM observabilité)
  - path_regex: secrets/myosotis\.yaml$
    key_groups:
      - age:
          # Même clé partagée
          - *shared

  # Secrets pour l'hôte hawthorn (VM gateway)
  - path_regex: secrets/hawthorn\.yaml$
    key_groups:
      - age:
          # Même clé partagée
          - *shared

  # Secrets pour l'hôte marigold (macOS)
  - path_regex: secrets/marigold\.yaml$
    key_groups:
      - age:
          # Même clé partagée
          - *shared
  # Secrets communs (Tailscale OAuth, etc.)
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *shared
  # Secrets pour poppy (PBS non-NixOS)
  - path_regex: secrets/poppy\.yaml$
    key_groups:
      - age:
          - *shared
