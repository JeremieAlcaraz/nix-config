# Configuration Starship avec module dotfiles
command_timeout = 1500

format = """
$username\
$hostname\
$shell\
$directory\
$git_branch\
$git_state\
$git_status\
$package\
$nodejs\
$line_break\
$character"""

#[custom.dotfiles_version]
#command = "cat ~/dotfiles/.current_version 2>/dev/null || echo 'aucune'"
#when = "test -d ~/dotfiles"
#format = "dotfiles:[$output]($style) "
#style = "bold purple"



# ~/.config/starship.toml

# Git status module (native Starship - much faster than custom Python script)
[git_status]
format = '([$all_status$ahead_behind](bold red)) '
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "✖${count}"
untracked = "?${count}"
stashed = ""
modified = "+${count}"
staged = "●${count}"
renamed = ""
deleted = ""
disabled = false

# Config from Nix flake DX
[character]
success_symbol = "[🚀 DX ➜](bold green)"
error_symbol = "[💀 DX ➜](bold red)"

[directory]
truncation_length = 3
style = "bold yellow"

[nodejs]
symbol = "⬢ "

# Shell indicator using built-in module (relies on cleaned env vars)
[shell]
format = "$indicator "
style = ""
bash_indicator = "[🐚 bash](bold green)"
zsh_indicator = "[🐚 zsh](bold green)"
fish_indicator = "[🐟 fish](bold blue)"
nu_indicator = "[🚀 nu](bold purple)"
unknown_indicator = "shell"
disabled = false
