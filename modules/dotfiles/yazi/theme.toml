# Catppuccin Frappe Lavender theme for Yazi
# https://github.com/catppuccin/yazi

[app]
overall = { bg = "#303446" }

[mgr]
cwd = { fg = "#81c8be" }

find_keyword  = { fg = "#e5c890", italic = true }
find_position = { fg = "#f4b8e4", bg = "reset", italic = true }

marker_copied   = { fg = "#a6d189", bg = "#a6d189" }
marker_cut      = { fg = "#e78284", bg = "#e78284" }
marker_marked   = { fg = "#81c8be", bg = "#81c8be" }
marker_selected = { fg = "#babbf1", bg = "#babbf1" }

count_copied   = { fg = "#303446", bg = "#a6d189" }
count_cut      = { fg = "#303446", bg = "#e78284" }
count_selected = { fg = "#303446", bg = "#babbf1" }

border_symbol = "│"
border_style  = { fg = "#838ba7" }

syntect_theme = "~/.config/yazi/Catppuccin-frappe.tmTheme"

[tabs]
active   = { fg = "#303446", bg = "#c6d0f5", bold = true }
inactive = { fg = "#c6d0f5", bg = "#51576d" }

[mode]
normal_main = { fg = "#303446", bg = "#babbf1", bold = true }
normal_alt  = { fg = "#babbf1", bg = "#414559"}

select_main = { fg = "#303446", bg = "#a6d189", bold = true }
select_alt  = { fg = "#a6d189", bg = "#414559"}

unset_main  = { fg = "#303446", bg = "#eebebe", bold = true }
unset_alt   = { fg = "#eebebe", bg = "#414559"}

[indicator]
parent = { fg = "#303446", bg = "#c6d0f5" }
current = { fg = "#303446", bg = "#babbf1" }
preview = { fg = "#303446", bg = "#c6d0f5" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#a6d189", bg = "#51576d" }
progress_error  = { fg = "#e5c890", bg = "#e78284" }

perm_type  = { fg = "#8caaee" }
perm_read  = { fg = "#e5c890" }
perm_write = { fg = "#e78284" }
perm_exec  = { fg = "#a6d189" }
perm_sep   = { fg = "#838ba7" }

[input]
border   = { fg = "#babbf1" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#babbf1" }
active   = { fg = "#f4b8e4" }
inactive = {}

[confirm]
border     = { fg = "#babbf1" }
title      = { fg = "#babbf1" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "#babbf1" }

[tasks]
border  = { fg = "#babbf1" }
title   = {}
hovered = { fg = "#f4b8e4", bold = true  }

[which]
mask            = { bg = "#414559" }
cand            = { fg = "#81c8be" }
rest            = { fg = "#949cbb" }
desc            = { fg = "#f4b8e4" }
separator       = "  "
separator_style = { fg = "#626880" }

[help]
on      = { fg = "#81c8be" }
run     = { fg = "#f4b8e4" }
desc    = { fg = "#949cbb" }
hovered = { bg = "#626880", bold = true }
footer  = { fg = "#c6d0f5", bg = "#51576d" }

[notify]
title_info  = { fg = "#81c8be" }
title_warn  = { fg = "#e5c890" }
title_error = { fg = "#e78284" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#81c8be" },
	{ mime = "{audio,video}/*", fg = "#e5c890" },
	{ mime = "application/*zip", fg = "#f4b8e4" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f4b8e4" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#a6d189" },
	{ mime = "vfs/{absent,stale}", fg = "#51576d" },
	{ url = "*", is = "orphan", bg = "#e78284" },
	{ url = "*", is = "exec"  , fg = "#a6d189" },
	{ url = "*", is = "dummy", bg = "#e78284" },
	{ url = "*/", is = "dummy", bg = "#e78284" },
	{ url = "*/", fg = "#babbf1" },
]

[spot]
border = { fg = "#babbf1" }
title  = { fg = "#babbf1" }
tbl_cell = { fg = "#babbf1", reversed = true }
tbl_col = { bold = true }

